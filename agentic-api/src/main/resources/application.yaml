spring:
  application:
    name: agentic-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agentic}
    username: ${DB_USERNAME:agentic_user}
    password: ${DB_PASSWORD:agentic_password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: agentic-secret-key-for-demo-2026

agent:
  goal-parsing:
    url: ${AGENT_GOAL_PARSING_URL:http://localhost:8001}
  spending:
    url: ${AGENT_SPENDING_URL:http://localhost:8002}
  mission:
    url: ${AGENT_MISSION_URL:http://localhost:8003}
  execution:
    url: ${AGENT_EXECUTION_URL:http://localhost:8004}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

